<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Light DOM Events</title>
<style>
  button,input{margin:4px;padding:6px 10px}
  .box{border:1px solid #ccc;padding:6px;margin-top:6px;width:200px}
</style>
</head>
<body>

<h3>Click Example</h3>
<button id="btnClick">Click Me</button>
<div id="outClick" class="box">Not clicked</div>

<h3>Input Example</h3>
<input id="txtInput" placeholder="Type here">
<div id="outInput" class="box"></div>

<h3>Hover Example</h3>
<div id="hoverBox" class="box">Hover me</div>

<script src="93.js"></script>
</body>
</html>
