<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Function Example</title>
<style>
  button,input{margin:4px;padding:6px 10px}
  .box{border:1px solid #ccc;padding:6px;margin-top:6px;width:250px}
</style>
</head>
<body>

<h3>Greet Function</h3>
<input id="nameInput" placeholder="Enter your name">
<button id="greetBtn">Greet</button>
<div id="greetOut" class="box"></div>

<h3>Sum Function</h3>
<input id="num1" type="number" placeholder="Number 1">
<input id="num2" type="number" placeholder="Number 2">
<button id="sumBtn">Add</button>
<div id="sumOut" class="box"></div>

<h3>Random Function</h3>
<button id="randBtn">Generate Random 1-50</button>
<div id="randOut" class="box"></div>

<script src="95.js"></script>
</body>
</html>
