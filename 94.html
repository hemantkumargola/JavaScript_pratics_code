<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Number, Date & Math Examples</title>
<style>
  button,input{margin:4px;padding:6px 10px}
  .box{border:1px solid #ccc;padding:6px;margin-top:6px;width:250px}
</style>
</head>
<body>

<h3>Number Example</h3>
<input id="numInput" type="number" placeholder="Enter number">
<button id="doubleBtn">Double It</button>
<div id="numOut" class="box"></div>

<h3>Date Example</h3>
<button id="dateBtn">Show Date & Time</button>
<div id="dateOut" class="box"></div>

<h3>Math Example</h3>
<button id="randBtn">Random Number 1-100</button>
<div id="mathOut" class="box"></div>

<script src="94.js"></script>
</body>
</html>
